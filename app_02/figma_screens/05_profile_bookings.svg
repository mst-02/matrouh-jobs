    <text x="172" y="21" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">Quick Links</text>

    <!-- Link 1: Personal Data -->
    <g transform="translate(16, 55)">
