    <text x="286" y="31" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="8" font-weight="800" text-anchor="middle">1</text>

    <!-- Nav Icon 5: User Profile Active -->
    <circle cx="345" cy="35" r="18" fill="#FFFFFF" fill-opacity="0.15"/>
    <circle cx="345" cy="32" r="5" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M338 43 C338 39 341 38 345 38 C349 38 352 39 352 43" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Home Indicator -->
  <rect x="127" y="835" width="139" height="5" rx="2.5" fill="#000000" fill-opacity="0.3"/>
