  <!-- Bottom Navigation Bar (Profile Active) -->
  <g transform="translate(0, 770)">
    <path d="M0 24C0 10.7452 10.7452 0 24 0H369C382.255 0 393 10.7452 393 24V82H0V24Z" fill="#0F3B4C"/>
    
    <!-- Nav Icon 1: Home -->
