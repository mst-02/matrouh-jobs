      <rect x="12" y="18" width="48" height="48" rx="8" fill="#16566E"/>
      <path d="M22 45 L50 45 L42 55 L16 55 Z" fill="#FFFFFF"/>
      <path d="M28 26 L28 42 L46 42 Z" fill="#E2E8F0"/>

      <text x="72" y="38" fill="#0F3B4C" font-family="Montserrat, sans-serif" font-size="13" font-weight="800">Gouna Marina 1</text>
      <text x="72" y="55" fill="#64748B" font-family="Cairo, sans-serif" font-size="11">25 إبريل · 05:00 مساء</text>
      
      <!-- Ref tag & Active dot -->
      <text x="330" y="38" fill="#A98751" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" text-anchor="end">YF-26001482</text>
      <circle cx="325" cy="52" r="4" fill="#10B981"/>
    </g>

