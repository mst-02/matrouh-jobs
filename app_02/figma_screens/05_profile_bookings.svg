    <circle cx="0" cy="12" r="10" fill="#0F3B4C"/>
    <path d="M-18 36 C-18 28 -8 26 0 26 C8 26 18 28 18 36" fill="#0F3B4C"/>

    <text y="72" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="18" font-weight="800">أحمد محمود</text>
    <text y="90" fill="#C5A46D" font-family="Montserrat, sans-serif" font-size="11" font-weight="600">Ahmed Mahmoud · VIP</text>
