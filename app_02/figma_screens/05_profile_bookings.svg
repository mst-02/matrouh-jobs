    </g>

    <!-- Link 2: Wallet -->
    <g transform="translate(16, 92)">
      <text x="0" y="0" fill="#475569" font-family="Montserrat, sans-serif" font-size="11" font-weight="600">Wallet</text>
      <text x="295" y="0" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="end">محفظتي ‹</text>
      <line x1="0" y1="12" x2="313" y2="12" stroke="#F1F5F9" stroke-width="1"/>
    </g>

