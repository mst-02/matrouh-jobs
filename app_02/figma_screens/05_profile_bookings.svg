      <text x="295" y="0" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="end">الإعدادات ‹</text>
      <line x1="0" y1="12" x2="313" y2="12" stroke="#F1F5F9" stroke-width="1"/>
