      <rect x="12" y="18" width="48" height="48" rx="8" fill="#C5A46D"/>
      <rect x="20" y="32" width="32" height="16" rx="3" fill="#FFFFFF"/>
      <circle cx="28" cy="48" r="4" fill="#1E293B"/>
      <circle cx="44" cy="48" r="4" fill="#1E293B"/>

      <text x="72" y="38" fill="#0F3B4C" font-family="Montserrat, sans-serif" font-size="13" font-weight="800">Hurghada Reef</text>
      <text x="72" y="55" fill="#64748B" font-family="Cairo, sans-serif" font-size="11">28 إبريل · 05:00 مساء</text>
      
      <text x="330" y="38" fill="#A98751" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" text-anchor="end">YF-26001482</text>
      <path d="M322 52 L326 56 L332 50" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Notification Banner -->
    <g transform="translate(0, 205)">
      <rect width="345" height="52" rx="14" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
      <circle cx="28" cy="26" r="14" fill="#F59E0B" fill-opacity="0.2"/>
      <path d="M24 28 H32 C31 28 31 23 28 21 C25 23 25 28 24 28 Z" fill="#D97706"/>
      <circle cx="32" cy="20" r="2.5" fill="#EF4444"/>

      <text x="52" y="24" fill="#92400E" font-family="Montserrat, sans-serif" font-size="11" font-weight="800">Notification</text>
      <text x="52" y="40" fill="#B45309" font-family="Cairo, sans-serif" font-size="10">تأكيد موعد المغادرة مارينا 1 الساعة 5:00 م</text>

      <!-- Gear icon -->
      <circle cx="320" cy="26" r="5" stroke="#D97706" stroke-width="1.5"/>
