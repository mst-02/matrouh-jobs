<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iPhone 16 Pro Shell -->
  <rect width="393" height="852" rx="55" fill="#FAF8F5"/>
  <rect x="2" y="2" width="389" height="848" rx="53" stroke="#CBD5E1" stroke-width="4"/>
  
  <!-- Dynamic Island -->
  <rect x="141" y="15" width="111" height="30" rx="15" fill="#000000"/>
  <circle cx="230" cy="30" r="5" fill="#1E293B"/>

  <!-- Status Bar -->
  <text x="35" y="36" fill="#1E293B" font-family="Montserrat, sans-serif" font-size="14" font-weight="700">9:41</text>
  <g transform="translate(320, 24)" fill="#1E293B">
    <!-- Signal -->
    <path d="M1 9H3V12H1V9ZM5 6H7V12H5V6ZM9 3H11V12H9V3ZM13 0H15V12H13V0Z"/>
    <!-- Wifi -->
    <path d="M22 2C19.5 2 17.5 3 16 4.5L22 12L28 4.5C26.5 3 24.5 2 22 2Z"/>
    <!-- Battery -->
    <rect x="33" y="1" width="20" height="10" rx="3" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="35" y="3" width="13" height="6" rx="1.5" fill="#1E293B"/>
    <path d="M54 4V8" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Watermark Yacht BG -->
  <path d="M280 620 C220 580 180 660 120 620 C80 590 50 630 10 610 L30 720 C100 750 300 760 380 710 Z" fill="#0F3B4C" fill-opacity="0.03"/>

  <!-- Logo & Header -->
  <g transform="translate(196, 150)" text-anchor="middle">
    <!-- Logo Icon -->
    <rect x="-24" y="-55" width="48" height="48" rx="14" fill="#0F3B4C"/>
    <!-- Stylized Sailboat / Y icon -->
    <path d="M-8 -35 L8 -35 L0 -45 Z" fill="#C5A46D"/>
    <path d="M-12 -25 C-5 -21 5 -21 12 -25 C8 -19 -8 -19 -12 -25 Z" fill="#C5A46D"/>

    <!-- Brand Name -->
    <text y="15" fill="#0F3B4C" font-family="Montserrat, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">YachtFlow</text>
    <text y="52" fill="#0F3B4C" font-family="Montserrat, sans-serif" font-size="22" font-weight="700">Welcome Back</text>
    <text y="82" fill="#A98751" font-family="Cairo, sans-serif" font-size="18" font-weight="700">مرحباً بك</text>
  </g>

  <!-- Form Fields -->
  <g transform="translate(32, 300)">
    <!-- Field 1: Username -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#475569" font-family="Montserrat, sans-serif" font-size="12" font-weight="600">Username or Email</text>
      <text x="329" y="0" fill="#475569" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="end">اسم المستخدم</text>
      <rect y="10" width="329" height="52" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="44" y="42" fill="#1E293B" font-family="Montserrat, sans-serif" font-size="14">ahmed.mahmoud@example.com</text>
      <!-- User Icon -->
      <circle cx="24" cy="36" r="6" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M14 47 C14 42 19 41 24 41 C29 41 34 42 34 47" stroke="#94A3B8" stroke-width="1.5"/>
    </g>

    <!-- Field 2: Password -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" fill="#475569" font-family="Montserrat, sans-serif" font-size="12" font-weight="600">Password</text>
      <text x="329" y="0" fill="#475569" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="end">كلمة المرور</text>
      <rect y="10" width="329" height="52" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="44" y="44" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="20" letter-spacing="3">••••••••••••</text>
      <!-- Lock Icon -->
      <rect x="18" y="32" width="12" height="10" rx="2" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M21 32 V28 C21 26.5 22.5 25 24 25 C25.5 25 27 26.5 27 28 V32" stroke="#94A3B8" stroke-width="1.5"/>
      <!-- Eye Icon -->
      <path d="M300 36 C304 33 310 33 314 36 C310 39 304 39 300 36 Z" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="307" cy="36" r="2" fill="#94A3B8"/>
    </g>

    <!-- Forgot Password -->
    <text x="164" y="185" fill="#64748B" font-family="Cairo, sans-serif" font-size="12" text-anchor="middle">هل نسيت كلمة المرور؟ / Forgot Password?</text>

    <!-- Login Button -->
    <rect y="215" width="329" height="54" rx="16" fill="#0F3B4C"/>
    <text x="164" y="248" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="16" font-weight="800" text-anchor="middle">تسجيل دخول</text>

    <!-- Register Link -->
    <text x="164" y="295" fill="#64748B" font-family="Cairo, sans-serif" font-size="12" text-anchor="middle">
      ليس لديك حساب؟ <tspan fill="#A98751" font-weight="700">إنشاء حساب جديد</tspan>
    </text>

    <!-- Social Login Section -->
    <g transform="translate(0, 335)">
      <line x1="20" y1="0" x2="110" y2="0" stroke="#E2E8F0" stroke-width="1"/>
      <text x="164" y="4" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Social Login</text>
      <line x1="219" y1="0" x2="309" y2="0" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Apple Button -->
      <circle cx="134" cy="45" r="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <path d="M132 40 C132 37 134 35 136 35 C135 37 133 39 132 40 Z M129 43 C127 43 125 45 125 48 C125 52 128 56 130 56 C131 56 132 55 134 55 C136 55 137 56 138 56 C140 56 143 52 143 48 C143 45 141 43 138 43 C136 43 135 44 134 44 C133 44 131 43 129 43 Z" fill="#000000"/>

      <!-- Google Button -->
      <circle cx="194" cy="45" r="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="194" y="51" fill="#EA4335" font-family="Montserrat, sans-serif" font-size="18" font-weight="800" text-anchor="middle">G</text>
    </g>
  </g>

  <!-- Home Indicator -->
  <rect x="127" y="835" width="139" height="5" rx="2.5" fill="#000000" fill-opacity="0.3"/>
</svg>
