  <!-- Action CTA -->
  <g transform="translate(24, 725)">
    <rect width="345" height="50" rx="16" fill="#C5A46D"/>
    <text x="172" y="32" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="15" font-weight="800" text-anchor="middle">عرض في الحجوزات النشطة 📋</text>
    
    <text x="172" y="72" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="13" font-weight="700" text-anchor="middle">العودة للرئيسية ←</text>
  </g>

  <!-- Home Indicator -->
  <rect x="127" y="835" width="139" height="5" rx="2.5" fill="#000000" fill-opacity="0.3"/>
</svg>
