    </g>

    <!-- Verified Badge -->
    <text x="172" y="194" fill="#059669" font-family="Cairo, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ تذكرة إلكترونية معتمدة للمارينا</text>

    <!-- Dashed Fold Line -->
    <line x1="20" y1="210" x2="325" y2="210" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Ticket Details Section -->
    <g transform="translate(24, 230)">
      <text x="0" y="0" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="15" font-weight="800">تم تأكيد الحجز</text>
      <text x="297" y="0" fill="#64748B" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" text-anchor="end">YF-26001482</text>

      <!-- Row 1: Passenger Name -->
      <g transform="translate(0, 30)">
        <text x="0" y="0" fill="#64748B" font-family="Montserrat, sans-serif" font-size="12">Passenger Name</text>
        <text x="297" y="0" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="15" font-weight="800" text-anchor="end">أحمد محمود</text>
      </g>

      <!-- Row 2: Date & Trip -->
      <g transform="translate(0, 75)">
        <text x="0" y="0" fill="#1E293B" font-family="Cairo, sans-serif" font-size="16" font-weight="800">25 إبريل</text>
        
        <rect x="180" y="-18" width="117" height="32" rx="10" fill="#F0F6F8"/>
        <text x="238" y="3" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="13" font-weight="700" text-anchor="middle">⛵ رحلة اليخت</text>
      </g>

      <!-- Row 3: Time & Location -->
      <g transform="translate(0, 125)">
        <text x="0" y="0" fill="#64748B" font-family="Cairo, sans-serif" font-size="14" font-weight="700">05:00 مساء</text>
        <text x="297" y="0" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="13" font-weight="700" text-anchor="end">📍 الجونة مارينا 1</text>
      </g>

      <!-- Row 4: Persons & Type -->
      <g transform="translate(0, 175)">
        <rect x="0" y="-16" width="115" height="30" rx="8" fill="#F1F5F9"/>
        <text x="57" y="4" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="middle">عدد الأفراد: 2</text>
        
        <text x="297" y="4" fill="#64748B" font-family="Cairo, sans-serif" font-size="13" font-weight="700" text-anchor="end">👥 الركاب</text>
      </g>

      <!-- Row 5: Status Pill -->
      <g transform="translate(0, 230)">
        <line x1="0" y1="-15" x2="297" y2="-15" stroke="#F1F5F9" stroke-width="1"/>
        <rect x="0" y="-4" width="70" height="28" rx="14" fill="#ECFDF5"/>
        <text x="35" y="15" fill="#059669" font-family="Montserrat, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Paid</text>
        
        <text x="297" y="15" fill="#059669" font-family="Cairo, sans-serif" font-size="13" font-weight="700" text-anchor="end">مدفوع بالكامل ✓</text>
      </g>
