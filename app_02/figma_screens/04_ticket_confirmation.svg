<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iPhone 16 Pro Shell -->
  <rect width="393" height="852" rx="55" fill="#F0F6F8"/>
  <rect x="2" y="2" width="389" height="848" rx="53" stroke="#CBD5E1" stroke-width="4"/>
  
  <!-- Dynamic Island -->
  <rect x="141" y="15" width="111" height="30" rx="15" fill="#000000"/>
  <circle cx="230" cy="30" r="5" fill="#1E293B"/>

  <!-- Status Bar -->
  <text x="35" y="36" fill="#1E293B" font-family="Montserrat, sans-serif" font-size="14" font-weight="700">9:41</text>
  <g transform="translate(320, 24)" fill="#1E293B">
    <path d="M1 9H3V12H1V9ZM5 6H7V12H5V6ZM9 3H11V12H9V3ZM13 0H15V12H13V0Z"/>
    <path d="M22 2C19.5 2 17.5 3 16 4.5L22 12L28 4.5C26.5 3 24.5 2 22 2Z"/>
    <rect x="33" y="1" width="20" height="10" rx="3" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="35" y="3" width="13" height="6" rx="1.5" fill="#1E293B"/>
    <path d="M54 4V8" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(196, 75)" text-anchor="middle">
    <!-- Success Icon -->
    <circle cx="0" cy="16" r="22" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <path d="M-8 16 L-2 22 L10 10" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text y="64" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="22" font-weight="900">تم تأكيد الحجز</text>
    <text y="90" fill="#A98751" font-family="Montserrat, sans-serif" font-size="16" font-weight="800" letter-spacing="1">YF-26001482</text>
  </g>

  <!-- Luxury Boarding Pass Ticket Card -->
  <g transform="translate(24, 185)">
    <!-- Base Card -->
    <rect width="345" height="520" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Cutout Circles on ticket fold -->
    <circle cx="0" cy="210" r="14" fill="#F0F6F8"/>
    <circle cx="345" cy="210" r="14" fill="#F0F6F8"/>

    <!-- QR Section -->
    <g transform="translate(82, 20)">
      <rect width="180" height="150" rx="16" fill="#F8FAFC" stroke="#C5A46D" stroke-width="2"/>
      
      <!-- Big QR Code Vector Art -->
      <g transform="translate(25, 10)">
        <rect x="0" y="0" width="34" height="34" rx="4" fill="#0F3B4C"/>
        <rect x="6" y="6" width="22" height="22" rx="2" fill="#FFFFFF"/>
        <rect x="11" y="11" width="12" height="12" rx="2" fill="#0F3B4C"/>

        <rect x="96" y="0" width="34" height="34" rx="4" fill="#0F3B4C"/>
        <rect x="102" y="6" width="22" height="22" rx="2" fill="#FFFFFF"/>
        <rect x="107" y="11" width="12" height="12" rx="2" fill="#0F3B4C"/>

        <rect x="0" y="96" width="34" height="34" rx="4" fill="#0F3B4C"/>
        <rect x="6" y="102" width="22" height="22" rx="2" fill="#FFFFFF"/>
        <rect x="11" y="107" width="12" height="12" rx="2" fill="#0F3B4C"/>

        <!-- Middle Brand Accent -->
        <rect x="52" y="52" width="26" height="26" rx="6" fill="#C5A46D"/>
        <!-- Data points -->
        <rect x="42" y="10" width="12" height="24" fill="#0F3B4C"/>
        <rect x="62" y="2" width="24" height="12" fill="#0F3B4C"/>
        <rect x="10" y="44" width="24" height="14" fill="#0F3B4C"/>
        <rect x="94" y="44" width="36" height="16" fill="#0F3B4C"/>
        <rect x="40" y="90" width="18" height="38" fill="#0F3B4C"/>
        <rect x="70" y="86" width="45" height="16" fill="#0F3B4C"/>
        <rect x="80" y="110" width="48" height="18" fill="#0F3B4C"/>
