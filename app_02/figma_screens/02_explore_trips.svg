<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iPhone 16 Pro Shell -->
  <rect width="393" height="852" rx="55" fill="#FAF8F5"/>
  <rect x="2" y="2" width="389" height="848" rx="53" stroke="#CBD5E1" stroke-width="4"/>
  
  <!-- Dynamic Island -->
  <rect x="141" y="15" width="111" height="30" rx="15" fill="#000000"/>
  <circle cx="230" cy="30" r="5" fill="#1E293B"/>

  <!-- Status Bar -->
  <text x="35" y="36" fill="#1E293B" font-family="Montserrat, sans-serif" font-size="14" font-weight="700">9:41</text>
  <g transform="translate(320, 24)" fill="#1E293B">
    <path d="M1 9H3V12H1V9ZM5 6H7V12H5V6ZM9 3H11V12H9V3ZM13 0H15V12H13V0Z"/>
    <path d="M22 2C19.5 2 17.5 3 16 4.5L22 12L28 4.5C26.5 3 24.5 2 22 2Z"/>
    <rect x="33" y="1" width="20" height="10" rx="3" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <rect x="35" y="3" width="13" height="6" rx="1.5" fill="#1E293B"/>
    <path d="M54 4V8" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Top Header / Greeting -->
  <g transform="translate(24, 75)">
    <text x="0" y="0" fill="#64748B" font-family="Cairo, sans-serif" font-size="12">مرحباً بك مجدداً</text>
    <text x="0" y="25" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="20" font-weight="800">أحمد محمود 👋</text>
    
    <!-- Notification Bell -->
    <circle cx="320" cy="12" r="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M315 17 H325 C324 17 324 10 320 8 C316 10 316 17 315 17 Z M319 20 C320 20 321 20 321 19 H319 C319 20 320 20 319 20 Z" fill="#0F3B4C"/>
    <circle cx="330" cy="4" r="4.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Filter Chips -->
  <g transform="translate(24, 125)">
    <!-- Active Chip: All -->
    <rect x="0" y="0" width="70" height="34" rx="17" fill="#0F3B4C"/>
    <text x="35" y="22" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="middle">الكل</text>

    <!-- Chip: Yachts -->
    <rect x="80" y="0" width="105" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="132" y="22" fill="#475569" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="middle">رحلات اليخوت</text>

    <!-- Chip: Safari -->
    <rect x="195" y="0" width="85" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="237" y="22" fill="#475569" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="middle">سفاري</text>

    <!-- Chip: Diving -->
    <rect x="290" y="0" width="55" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="317" y="22" fill="#475569" font-family="Cairo, sans-serif" font-size="12" font-weight="700" text-anchor="middle">غوص</text>
  </g>

  <!-- CARD 1: Yacht Trip -->
  <g transform="translate(24, 180)">
    <rect width="345" height="240" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Image Box with Sea Gradient -->
    <path d="M0 24C0 10.7452 10.7452 0 24 0H321C334.255 0 345 10.7452 345 24V125H0V24Z" fill="url(#seaGrad)"/>
    <!-- Yacht Vector Representation -->
    <g transform="translate(140, 45)">
      <path d="M0 45 L65 45 L50 62 L-10 62 Z" fill="#FFFFFF"/>
      <path d="M15 15 L15 42 L45 42 Z" fill="#F8FAFC"/>
      <path d="M12 22 L12 42 L-8 42 Z" fill="#E2E8F0"/>
      <rect x="5" y="32" width="25" height="8" rx="2" fill="#0F3B4C"/>
    </g>

    <!-- Yacht Badge Icon -->
    <circle cx="35" cy="35" r="18" fill="#C5A46D"/>
    <path d="M30 38 L40 38 L37 43 L28 43 Z" fill="#FFFFFF"/>
    <path d="M33 28 L33 36 L39 36 Z" fill="#FFFFFF"/>

    <!-- Rating Badge -->
    <rect x="260" y="85" width="70" height="24" rx="12" fill="#000000" fill-opacity="0.65"/>
    <text x="295" y="101" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★ 4.9</text>

    <!-- Card Body -->
    <text x="325" y="155" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="18" font-weight="800" text-anchor="end">رحلة اليخت</text>
    <text x="20" y="153" fill="#A98751" font-family="Montserrat, sans-serif" font-size="13" font-weight="700">Yacht</text>

    <!-- Location & Time -->
    <g transform="translate(325, 175)" text-anchor="end">
      <text x="-18" y="0" fill="#475569" font-family="Cairo, sans-serif" font-size="12">الجونة مارينا 1 · Gouna Marina 1</text>
      <circle cx="-5" cy="-4" r="4" fill="#C5A46D"/>
      
      <text x="-18" y="18" fill="#64748B" font-family="Cairo, sans-serif" font-size="12">05:00 مساء · 3 ساعات إبحار</text>
      <circle cx="-5" cy="14" r="4" fill="#C5A46D"/>
    </g>

    <!-- Footer Price & CTA -->
    <line x1="16" y1="202" x2="329" y2="202" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="20" y="228" fill="#A98751" font-family="Montserrat, sans-serif" font-size="20" font-weight="800">140 $</text>
    
    <rect x="235" y="210" width="95" height="26" rx="13" fill="#0F3B4C"/>
    <text x="282" y="227" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="11" font-weight="700" text-anchor="middle">احجز الآن ‹</text>
  </g>

  <!-- CARD 2: Safari Trip -->
  <g transform="translate(24, 440)">
    <rect width="345" height="240" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Image Box with Desert Gradient -->
    <path d="M0 24C0 10.7452 10.7452 0 24 0H321C334.255 0 345 10.7452 345 24V125H0V24Z" fill="url(#desertGrad)"/>
    <!-- Safari Car Vector Representation -->
    <g transform="translate(130, 50)">
      <rect x="0" y="25" width="75" height="26" rx="4" fill="#FFFFFF"/>
      <path d="M12 25 L24 8 L60 8 L68 25 Z" fill="#E2E8F0"/>
      <circle cx="16" cy="51" r="9" fill="#1E293B"/>
      <circle cx="58" cy="51" r="9" fill="#1E293B"/>
    </g>

    <!-- Safari Badge Icon -->
    <circle cx="35" cy="35" r="18" fill="#C5A46D"/>
    <rect x="26" y="32" width="18" height="9" rx="2" fill="#FFFFFF"/>
    <circle cx="29" cy="42" r="3" fill="#FFFFFF"/>
    <circle cx="41" cy="42" r="3" fill="#FFFFFF"/>

    <!-- Rating Badge -->
    <rect x="260" y="85" width="70" height="24" rx="12" fill="#000000" fill-opacity="0.65"/>
    <text x="295" y="101" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" text-anchor="middle">★ 4.8</text>

    <!-- Card Body -->
    <text x="325" y="155" fill="#0F3B4C" font-family="Cairo, sans-serif" font-size="18" font-weight="800" text-anchor="end">رحلة سفاري</text>
    <text x="20" y="153" fill="#A98751" font-family="Montserrat, sans-serif" font-size="13" font-weight="700">Safari</text>

    <!-- Location & Time -->
    <g transform="translate(325, 175)" text-anchor="end">
      <text x="-18" y="0" fill="#475569" font-family="Cairo, sans-serif" font-size="12">الغردقة ريف · Hurghada Reef</text>
      <circle cx="-5" cy="-4" r="4" fill="#C5A46D"/>
      
      <text x="-18" y="18" fill="#64748B" font-family="Cairo, sans-serif" font-size="12">05:00 مساء · مع غروب الشمس</text>
      <circle cx="-5" cy="14" r="4" fill="#C5A46D"/>
    </g>

    <!-- Footer Price & CTA -->
    <line x1="16" y1="202" x2="329" y2="202" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="20" y="228" fill="#A98751" font-family="Montserrat, sans-serif" font-size="20" font-weight="800">75 $</text>
    
    <rect x="235" y="210" width="95" height="26" rx="13" fill="#0F3B4C"/>
    <text x="282" y="227" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="11" font-weight="700" text-anchor="middle">احجز الآن ‹</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 770)">
    <path d="M0 24C0 10.7452 10.7452 0 24 0H369C382.255 0 393 10.7452 393 24V82H0V24Z" fill="#0F3B4C"/>
    
    <!-- Nav Icon 1: Home Active -->
    <circle cx="45" cy="35" r="18" fill="#FFFFFF" fill-opacity="0.15"/>
    <path d="M38 38 L45 31 L52 38 V42 H38 Z" fill="#FFFFFF"/>

    <!-- Nav Icon 2: Calendar -->
    <rect x="110" y="28" width="16" height="14" rx="2" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
    <line x1="110" y1="33" x2="126" y2="33" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Floating Action Button (Center QR Scan) -->
    <circle cx="196" cy="10" r="32" fill="#FAF8F5"/>
    <circle cx="196" cy="10" r="28" fill="#C5A46D"/>
    <!-- QR Icon in FAB -->
    <g transform="translate(186, 0)" fill="#FFFFFF">
      <rect x="0" y="0" width="8" height="8" rx="1.5"/>
      <rect x="12" y="0" width="8" height="8" rx="1.5"/>
      <rect x="0" y="12" width="8" height="8" rx="1.5"/>
      <rect x="14" y="14" width="4" height="4"/>
    </g>

    <!-- Nav Icon 4: Map Location -->
    <circle cx="275" cy="35" r="4" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M275 39 L275 43" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Nav Icon 5: User Profile -->
    <circle cx="345" cy="32" r="5" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M338 43 C338 39 341 38 345 38 C349 38 352 39 352 43" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Home Indicator -->
  <rect x="127" y="835" width="139" height="5" rx="2.5" fill="#000000" fill-opacity="0.3"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="345" y2="125" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F3B4C"/>
      <stop offset="1" stop-color="#16566E"/>
    </linearGradient>
    <linearGradient id="desertGrad" x1="0" y1="0" x2="345" y2="125" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C5A46D"/>
      <stop offset="1" stop-color="#8C6D37"/>
    </linearGradient>
  </defs>
</svg>
